Name: GHI Engine Sync

on:
  schedule:
    - cron: '*/5 * * * *' # Runs every 5 minutes
  workflow_dispatch: # Allows manual execution

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install groq openai

      - name: Run GHI Engine (Groq + Divine NVIDIA Failover)
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: python main.py

      - name: Commit and Push Results
        run: |
          git config --global user.name "GHI-Bot"
          git config --global user.email "ghi-bot@celsius.tech"
          git add shi_data.json
          git commit -m "System Sync: $(date)" || exit 0
          git push
